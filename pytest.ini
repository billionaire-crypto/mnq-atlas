[pytest]
# Authorised in the re-audit 5 decision. Each full run was retaining ~319 MB of
# pytest temporary data, and three consecutive runs need more headroom than the
# volume has, so the suite intermittently died with "no space left on device".
# Retaining nothing for a passing test removes the accumulation at its source.
# Cleanup of read-only git objects is left to the installed pytest, which already
# chmods and retries; a custom cleanup hook was explicitly NOT authorised until
# this configuration alone has been tried.
tmp_path_retention_policy = failed
tmp_path_retention_count = 0
